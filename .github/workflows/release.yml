name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run core && npm run build
        working-directory: web
      - name: Package the built web client
        run: |
          name="felix-arena-web-${GITHUB_REF_NAME}"
          mv web/dist "$name"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            "felix-arena-web-${GITHUB_REF_NAME}.tar.gz" \
            "felix-arena-web-${GITHUB_REF_NAME}.tar.gz.sha256"

  site:
    needs: web
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The site's Release versions workflow also runs hourly, so a missing token only delays the update.
      - name: Dispatch release-published to the site
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SITE: ${{ github.repository_owner }}/getfelix.github.io
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; the site picks up the release within the hour."
            exit 0
          fi
          gh api "repos/$SITE/dispatches" -f event_type=release-published
