name: Release

# A v* tag releases that version: the built web client and the images
# ghcr.io/getfelix/felix-arena-{sim,gateway,seed,idp} (amd64 and arm64,
# signed with cosign) and the Helm chart, in one GitHub release.
#
# A pull request that changes the images, and a manual run, build everything
# and publish nothing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - docker/**
      - core/**
      - sim/**
      - web/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - dev/idp.mjs
      - dev/seed.mjs
      - dev/scope.toml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISH: ${{ github.event_name == 'push' }}
  REGISTRY: ghcr.io/getfelix

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run core && npm run build
        working-directory: web
      - name: Package the built web client
        run: |
          # A pull request's ref name has a slash in it.
          name="felix-arena-web-${GITHUB_REF_NAME//\//-}"
          mkdir pkg
          cp -r web/dist "pkg/$name"
          tar -C pkg -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      # The gateway image carries the same files.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: web-package
          path: felix-arena-web-*.tar.gz*
          if-no-files-found: error
          retention-days: 1

  image:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: web
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [sim, gateway, seed, idp]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ghcr.io/getfelix/felix-arena-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: The built web client
        if: matrix.image == 'gateway'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest and untagged: a tag would name one platform until the
      # manifest list below takes it over.
      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digest"
          echo "${DIGEST:-not-pushed}" > "${RUNNER_TEMP}/digest/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: ${{ matrix.image }} manifest
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign gets a short-lived certificate for this
      # workflow's identity, so there is no key to store.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [sim, gateway, seed, idp]
    env:
      IMAGE: ghcr.io/getfelix/felix-arena-${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digest
          merge-multiple: true

      - name: Both platform digests
        working-directory: ${{ runner.temp }}/digest
        run: |
          [ "$(ls -1 | tr '\n' ' ')" = "amd64 arm64 " ] || { echo "::error::expected amd64 and arm64"; exit 1; }

      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` only for a version without a pre-release suffix.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create the manifest list
        id: merge
        working-directory: ${{ runner.temp }}/digest
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${IMAGE}@$(cat amd64)" "${IMAGE}@$(cat arm64)"
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${digest}" > "${RUNNER_TEMP}/merged"

      # By digest, never by tag: a tag can move and the signature would not.
      - name: Sign
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: actions/upload-artifact@v4
        with:
          name: merged-${{ matrix.image }}
          path: ${{ runner.temp }}/merged
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [web, manifest]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Package the Helm chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm lint deploy/helm/felix-arena -f deploy/helm/felix-arena/ci/kind-values.yaml
          helm package deploy/helm/felix-arena --version "$version" --app-version "$version"

      - uses: actions/download-artifact@v4
        with:
          name: web-package

      - uses: actions/download-artifact@v4
        with:
          pattern: merged-*
          path: merged

      - uses: sigstore/cosign-installer@v3

      # A new GHCR package starts private, so the first release's check must log in.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > notes.md
          {
            echo
            echo "## Images"
            echo
            echo "Each is built for amd64 and arm64 and signed with cosign. Check one before running it:"
            echo
            echo '```bash'
            echo "cosign verify ghcr.io/getfelix/felix-arena-sim@<digest> \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "| Image | Digest |"
            echo "| --- | --- |"
          } >> notes.md
          for image in sim gateway seed idp; do
            ref="ghcr.io/getfelix/felix-arena-${image}"
            digest=$(cat "merged/merged-${image}/merged")
            cosign verify "${ref}@${digest}" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@refs/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "| \`felix-arena-${image}:${GITHUB_REF_NAME#v}\` | \`${digest}\` |" >> notes.md
          done
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # There is no checkout here for gh to find the repository in.
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            "${prerelease[@]}" --notes-file notes.md felix-arena-web-*.tar.gz* felix-arena-*.tgz

  site:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The site's Release versions workflow also runs hourly, so a missing token only delays the update.
      - name: Dispatch release-published to the site
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SITE: ${{ github.repository_owner }}/getfelix.github.io
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; the site picks up the release within the hour."
            exit 0
          fi
          gh api "repos/$SITE/dispatches" -f event_type=release-published
