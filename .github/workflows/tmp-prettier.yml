name: tmp prettier
on: push
jobs:
  fmt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write . && git diff > /tmp/fmt.patch; cat /tmp/fmt.patch
      - run: npm run typecheck && npm test
