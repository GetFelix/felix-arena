name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # core/ in WebAssembly, and ticks from a native run for the tests to decode.
      - run: npm run core
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frame:
    name: style frame
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run core
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The app and the prototype it was ported from, at the same frozen moment, in headless Chromium on SwiftShader.
      - name: The app matches the style frame
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory ../prototype &
          for port in 4173 4174; do
            for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:$port/" >/dev/null && break; sleep 1; done
          done
          npm run frame -- http://127.0.0.1:4173/ http://127.0.0.1:4174/style-frame.html frames
        env:
          FRAME_MAX_DIFFERING_PERCENT: '100'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: web/frames

  rust-fmt:
    name: rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  rust-clippy:
    name: rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p felix-arena-core --lib --target wasm32-unknown-unknown --locked -- -D warnings

  rust-test:
    name: rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  dev-stack:
    name: dev stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dev/up.sh
      - name: The sim commits ticks at 30 Hz in both arenas
        run: |
          # Each arena reports every 5 s. The first report includes startup, so
          # judge the rate on a later one.
          for _ in $(seq 1 45); do
            logs="$(docker compose -f dev/compose.yml logs --no-color sim 2>&1)"
            ok=0
            for arena in alpha bravo; do
              hz="$(grep 'ticks committed' <<<"$logs" | grep -E "arena=\"?$arena\"? " \
                | tail -n +2 | tail -1 | grep -oE 'hz=[0-9.]+' | cut -d= -f2 || true)"
              if [[ -n "$hz" ]] && awk -v hz="$hz" 'BEGIN { exit !(hz >= 28 && hz <= 31) }'; then
                ok=$((ok + 1))
              fi
            done
            if [[ $ok -eq 2 ]]; then
              grep 'ticks committed' <<<"$logs"
              exit 0
            fi
            sleep 2
          done
          echo "the sim did not report 30 Hz for both arenas" >&2
          exit 1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Ticks reach a WebSocket client through the gateway, and decode to the sim's state hashes
        working-directory: web
        run: |
          npm ci
          npm run core
          npm run smoke
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color
