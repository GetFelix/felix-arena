name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # core/ in WebAssembly, and ticks from a native run for the tests to decode.
      - run: npm run core
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frame:
    name: style frame
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run core
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # The app and the prototype it was ported from, at the same frozen moment, in headless Chromium on SwiftShader.
      - name: The app matches the style frame
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory ../prototype &
          for port in 4173 4174; do
            up=0
            for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:$port/" >/dev/null && up=1 && break; sleep 1; done
            [[ $up -eq 1 ]] || { echo "nothing is serving on port $port" >&2; exit 1; }
          done
          npm run frame -- http://127.0.0.1:4173/ http://127.0.0.1:4174/style-frame.html frames
          # A second moment, with different shots and hits in flight.
          FRAME_T=0.4 npm run frame -- http://127.0.0.1:4173/ http://127.0.0.1:4174/style-frame.html frames/t-0.4
        env:
          FRAME_MAX_DIFFERING_PERCENT: '0.01'
      - name: The effects kit holds its budget and allocates nothing
        run: |
          npx vite preview --host 127.0.0.1 --port 4175 --strictPort &
          up=0
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4175/fx-bench.html >/dev/null && up=1 && break; sleep 1; done
          [[ $up -eq 1 ]] || { echo "nothing is serving on port 4175" >&2; exit 1; }
          node scripts/fx-bench.mjs http://127.0.0.1:4175/fx-bench.html
      # Plays offline until the bots destroy your craft, then shoots it back under its spawn shield, for review.
      - name: A respawn draws its spawn shield
        run: |
          npx vite preview --host 127.0.0.1 --port 4176 --strictPort &
          up=0
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4176/play.html >/dev/null && up=1 && break; sleep 1; done
          [[ $up -eq 1 ]] || { echo "nothing is serving on port 4176" >&2; exit 1; }
          npx vite-node scripts/respawn-shot.ts -- http://127.0.0.1:4176/play.html frames/respawn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: web/frames

  rust-fmt:
    name: rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  rust-clippy:
    name: rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p felix-arena-core --lib --target wasm32-unknown-unknown --locked -- -D warnings

  rust-test:
    name: rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  dev-stack:
    name: dev stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dev/up.sh
      - name: The sim commits ticks at 30 Hz in both arenas
        run: |
          # Each arena reports every 5 s. The first report includes startup, so
          # judge the rate on a later one.
          for _ in $(seq 1 45); do
            logs="$(docker compose -f dev/compose.yml logs --no-color sim 2>&1)"
            ok=0
            for arena in alpha bravo; do
              hz="$(grep 'ticks committed' <<<"$logs" | grep -E "arena=\"?$arena\"? " \
                | tail -n +2 | tail -1 | grep -oE 'hz=[0-9.]+' | cut -d= -f2 || true)"
              if [[ -n "$hz" ]] && awk -v hz="$hz" 'BEGIN { exit !(hz >= 28 && hz <= 31) }'; then
                ok=$((ok + 1))
              fi
            done
            if [[ $ok -eq 2 ]]; then
              grep 'ticks committed' <<<"$logs"
              exit 0
            fi
            sleep 2
          done
          echo "the sim did not report 30 Hz for both arenas" >&2
          exit 1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Ticks reach a WebSocket client through the gateway, and decode to the sim's state hashes
        working-directory: web
        run: |
          npm ci
          npm run core
          npm run smoke
      - name: The live page puts each input into the next frame's scene, timed
        working-directory: web
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/play.html >/dev/null && break; sleep 1; done
          node scripts/input-to-pixel.mjs 'http://127.0.0.1:4173/play.html?arena=alpha&as=ana&quality=low'
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color

  join:
    name: join mid-match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dev/up.sh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cold spectators join a match being played, draw within 500 ms p50, and fold to the player's state
        working-directory: web
        run: |
          npm ci
          npm run core
          npm run build
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/play.html >/dev/null && break; sleep 1; done
          npx vite-node scripts/join.ts -- http://127.0.0.1:4173/play.html 20
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color

  throttle:
    name: throttle lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dev/up.sh
        env:
          # One match for the whole lane: it measures a minute and a half of play.
          SIM_WARMUP_SECONDS: '5'
          SIM_MATCH_SECONDS: '600'
          SIM_KILL_LIMIT: '999'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: A throttled spectator falls behind while two others' trip time stays within 10%
        working-directory: web
        run: |
          npm ci
          npm run core
          npx vite-node scripts/throttle.ts -- 16 30
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color

  restart:
    name: sim restart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: dev/up.sh
        env:
          SIM_WARMUP_SECONDS: '5'
          SIM_KILL_LIMIT: '99'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Killing the sim mid-match pauses play for under 5 s, and the match goes on in the next epoch with its scores
        working-directory: web
        run: |
          npm ci
          npm run core
          npx vite-node scripts/restart.ts
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color

  gaps:
    name: gap fill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dev/up.sh
        env:
          # Short matches with a low kill limit, so kills keep happening for the minute and a half the page is watched.
          SIM_WARMUP_SECONDS: '5'
          SIM_MATCH_SECONDS: '60'
          SIM_RESULTS_SECONDS: '5'
          SIM_KILL_LIMIT: '99'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: A page that loses one tick in seven reads them back and folds to the player's state, kills included
        working-directory: web
        run: |
          npm ci
          npm run core
          npm run build
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/play.html >/dev/null && break; sleep 1; done
          npx vite-node scripts/gaps.ts -- http://127.0.0.1:4173/play.html 90
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color

  match:
    name: match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A short match, so a whole one fits in the job: warmup, play, results and the next warmup.
      # Results last long enough to be screenshotted even when the match ends during the live screenshot, which takes
      # about 45 s in software and delays seeing the results by as much.
      - run: dev/up.sh
        env:
          SIM_WARMUP_SECONDS: '5'
          SIM_MATCH_SECONDS: '100'
          SIM_RESULTS_SECONDS: '120'
          SIM_KILL_LIMIT: '10'
          SIM_RAIL_SECONDS: '10'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Two browsers and two bots play a whole match through the gateway
        working-directory: web
        run: |
          npm ci
          npm run core
          npm run build
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/play.html >/dev/null && break; sleep 1; done
          npx vite-node scripts/match.ts -- http://127.0.0.1:4173/play.html shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-shots
          path: web/shots
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color

  killcam:
    name: kill cam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dev/up.sh
        env:
          SIM_WARMUP_SECONDS: '5'
          SIM_MATCH_SECONDS: '600'
          SIM_KILL_LIMIT: '99'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Every kill replays from the log in time, and a victim's page plays its kill cam
        working-directory: web
        run: |
          npm ci
          npm run core
          npm run build
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/play.html >/dev/null && break; sleep 1; done
          npx vite-node scripts/killcam.ts -- http://127.0.0.1:4173/play.html killcam
          # Each view at 1920x1080, held a moment before the kill, for review.
          npx vite-node scripts/killcam-shot.ts -- 'http://127.0.0.1:4173/play.html?arena=alpha&as=ben&quality=high' killcam/views
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: killcam
          path: web/killcam
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color

  failover:
    name: broker failover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: dev/up.sh --cluster
        env:
          SIM_WARMUP_SECONDS: '5'
          SIM_MATCH_SECONDS: '600'
          SIM_KILL_LIMIT: '99'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Killing the broker that owns the ticks pauses play briefly, and no acknowledged tick is lost
        working-directory: web
        run: |
          npm ci
          npm run core
          npm run build
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/play.html >/dev/null && break; sleep 1; done
          npx vite-node scripts/failover.ts -- http://127.0.0.1:4173/play.html
      - if: failure()
        run: docker compose -f dev/compose.yml -f dev/compose.cluster.yml logs --no-color

  feed:
    name: kill feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Short matches, and a broker that keeps about three minutes of each log, so a kill of the last match can be seen
      # replayed and then refused once retention has passed it.
      - run: dev/up.sh
        env:
          ARENA_COMPOSE_EXTRA: retention.yml
          SIM_WARMUP_SECONDS: '5'
          SIM_MATCH_SECONDS: '45'
          SIM_RESULTS_SECONDS: '5'
          SIM_KILL_LIMIT: '99'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: A spectator replays kills of the last match from the panel and from its log, and a trimmed one is refused
        working-directory: web
        run: |
          npm ci
          npm run core
          npm run build
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/play.html >/dev/null && break; sleep 1; done
          npx vite-node scripts/feed.ts -- http://127.0.0.1:4173/play.html feed
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed
          path: web/feed
      - if: failure()
        run: docker compose -f dev/compose.yml -f dev/retention.yml logs --no-color

  identity:
    name: kill cam identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: dev/up.sh
        env:
          SIM_WARMUP_SECONDS: '5'
          SIM_MATCH_SECONDS: '600'
          SIM_KILL_LIMIT: '99'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Three browsers, one losing live ticks, replay the same kill to the same bytes
        working-directory: web
        run: |
          npm ci
          npm run core
          npm run build
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/play.html >/dev/null && break; sleep 1; done
          npx vite-node scripts/identity.ts -- http://127.0.0.1:4173/play.html
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color

  self-host:
    name: self-host
    runs-on: ubuntu-latest
    env:
      ARENA_VERSION: local
      COMPOSE: docker compose -f deploy/compose.yml
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web client and the four images the guide pulls
        run: |
          (cd web && npm ci && npm run core && npm run build)
          for image in sim gateway seed idp; do
            docker build -f "docker/$image.Dockerfile" -t "ghcr.io/getfelix/felix-arena-$image:local" .
          done
      - name: The guide's compose file starts, and the sim holds 30 Hz
        run: |
          $COMPOSE up --detach
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8787/play.html >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8787/oidc
          for _ in $(seq 1 45); do
            hz="$($COMPOSE logs --no-color sim 2>&1 | grep 'ticks committed' | grep -E 'arena="?alpha"? ' \
              | tail -n +2 | tail -1 | grep -oE 'hz=[0-9.]+' | cut -d= -f2 || true)"
            if [[ -n "$hz" ]] && awk -v hz="$hz" 'BEGIN { exit !(hz >= 28 && hz <= 31) }'; then exit 0; fi
            sleep 2
          done
          echo "the sim did not report 30 Hz" >&2
          exit 1
      - name: A browser signs in through it and plays
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/input-to-pixel.mjs 'http://127.0.0.1:8787/play.html?arena=alpha&as=ana&quality=low'
      - name: Stopping and starting keeps the arenas, and the ticks flow again
        run: |
          $COMPOSE down
          $COMPOSE up --detach
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8787/play.html >/dev/null && break; sleep 2; done
          cd web && node scripts/input-to-pixel.mjs 'http://127.0.0.1:8787/play.html?arena=alpha&as=ana&quality=low'
      - if: failure()
        run: $COMPOSE logs --no-color

  fanout:
    name: spectator fanout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: dev/up.sh
        env:
          # One match for the whole job: it measures three phases of play.
          SIM_WARMUP_SECONDS: '5'
          SIM_MATCH_SECONDS: '600'
          SIM_KILL_LIMIT: '999'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo build --release --locked -p felix-arena-sim --example spectators
      - name: 100 spectators leave the players' trip time and the sim's commit time within 10% of the quiet phases
        working-directory: web
        run: |
          npm ci
          npm run core
          npx vite-node scripts/fanout.ts -- ../target/release/examples/spectators 100 20
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The Felix release whose chart this one is installed next to.
      - id: felix
        run: echo "ref=v$(sed -n 's/^version=//p' .felix-version)" >> "$GITHUB_OUTPUT"
      - name: The Felix chart
        uses: actions/checkout@v4
        with:
          repository: GetFelix/felix
          ref: ${{ steps.felix.outputs.ref }}
          path: felix
          sparse-checkout: deploy/helm/felix
      - uses: azure/setup-helm@v4
      - run: |
          helm lint deploy/helm/felix-arena -f deploy/helm/felix-arena/ci/kind-values.yaml
          helm package deploy/helm/felix-arena --destination "$RUNNER_TEMP"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web client and the four images
        run: |
          (cd web && npm ci && npm run core && npm run build)
          for image in sim gateway seed idp; do
            docker build -f "docker/$image.Dockerfile" -t "ghcr.io/getfelix/felix-arena-$image:ci" .
          done
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - name: Install Felix and the chart
        env:
          FELIX_CHART: ${{ github.workspace }}/felix/deploy/helm/felix
        run: |
          for image in sim gateway seed idp; do kind load docker-image "ghcr.io/getfelix/felix-arena-$image:ci"; done
          deploy/helm/felix-arena/ci/kind-install.sh
      - name: A browser signs in through the gateway and plays
        working-directory: web
        run: |
          kubectl port-forward svc/felix-arena-gateway 8787:80 &
          kubectl port-forward svc/felix-arena-idp 9400:9400 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8787/play.html >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:9400/jwks.json >/dev/null
          npm ci
          npx playwright install --with-deps chromium
          node scripts/input-to-pixel.mjs 'http://127.0.0.1:8787/play.html?arena=alpha&as=ana&quality=low'
      - if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods | grep -E '^(Name:|Events:)|Warning|Error' | tail -80
          kubectl logs -l app.kubernetes.io/instance=felix-arena --all-containers --tail 100
          kubectl logs felix-broker-0 --tail 100
          kubectl logs felix-controlplane-0 --tail 100

  resync:
    name: resync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: dev/up.sh
        env:
          SIM_WARMUP_SECONDS: '5'
          SIM_MATCH_SECONDS: '600'
          SIM_KILL_LIMIT: '999'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: A page slowed below the ticks rejoins from the keyframe, then holds the same state as a player
        working-directory: web
        run: |
          npm ci
          npm run core
          npm run build
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/play.html >/dev/null && break; sleep 1; done
          npx vite-node scripts/resync.ts -- http://127.0.0.1:4173/play.html
      - if: failure()
        run: docker compose -f dev/compose.yml logs --no-color
