name: scratch
on:
  push:
    branches: [style-frame-vite]
jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --save-dev --save-exact playwright@1.48.2 pixelmatch@6.0.0 pngjs@7.0.0
      - run: npx prettier --write .
      - run: git status --short
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            web
            !web/node_modules
