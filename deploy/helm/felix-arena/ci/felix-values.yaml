# The felix chart, as CI runs it on kind next to this chart: a three-member
# Raft control plane, which keeps the metadata in its own volumes with no
# database, and one broker. Install it first with broker.enabled=false, then
# this chart, then upgrade it with broker.enabled=true and the broker
# credential the seed stored.
controlplane:
  replicas: 3
  storage:
    backend: raft
    raft:
      volume:
        size: 1Gi
      peerToken:
        existingSecret: felix-raft-peer
  bootstrap:
    enabled: true
    existingSecret: felix-bootstrap
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  extraEnv:
    # The seed's sign-in page is plain HTTP inside the cluster.
    - name: FELIX_CONTROLPLANE_OIDC_ALLOW_INSECURE_HTTP
      value: "true"
    - name: FELIX_CONTROLPLANE_OIDC_ALLOWED_ALGORITHMS
      value: ES256,RS256
    # The broker and the sim read their tokens once at startup.
    - name: FELIX_EXCHANGE_TOKEN_TTL_SECONDS
      value: "2592000"
broker:
  enabled: false
  replicas: 1
  credential:
    existingSecret: felix-arena-broker-credential
  peerTls:
    allowUnauthenticated: true
  # One certificate for every broker, naming felix-broker; the arena trusts
  # its tls.crt.
  clientTls:
    enabled: true
    existingSecret: felix-broker-tls
  # Discovery drops advertised names that are not IP addresses, so advertise
  # the pod's IP rather than its DNS name.
  clientAdvertiseAddr: "$(POD_IP):5000"
  storage:
    size: 1Gi
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnv:
    # Each log reserves a whole segment up front.
    - name: FELIX_DURABLE_SEGMENT_BYTES
      value: "16777216"
    - name: FELIX_EVENT_BATCH_MAX_EVENTS
      value: "8"
    - name: FELIX_EVENT_BATCH_MAX_DELAY_US
      value: "100"
    - name: FELIX_FANOUT_BATCH
      value: "8"
    - name: FELIX_SUB_FLUSH_MAX_DELAY_US
      value: "0"
    - name: FELIX_SUB_QUEUE_POLICY
      value: drop_new
