{{- $name := printf "%s-idp" (include "arena.fullname" .) -}}
{{- $p := .Values.idp -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: idp
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "arena.selector" (list . "idp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arena.selector" (list . "idp") | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: idp
          image: {{ include "arena.image" (list . $p.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "arena.securityContext" . | nindent 12 }}
          env:
            - name: IDP_ISSUER
              value: {{ required "idp.issuer is required" $p.issuer | quote }}
            - name: IDP_USERS
              value: {{ concat .Values.players .Values.watchers | join "," | quote }}
          ports:
            - name: http
              containerPort: 9400
          readinessProbe:
            httpGet:
              path: /jwks.json
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml $p.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "arena.labels" . | nindent 4 }}
    app.kubernetes.io/component: idp
spec:
  ports:
    - name: http
      port: 9400
      targetPort: http
  selector:
    {{- include "arena.selector" (list . "idp") | nindent 4 }}
{{- if $p.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "arena.labels" . | nindent 4 }}
  {{- with $p.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $p.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $p.ingress.tlsSecret }}
  tls:
    - hosts: [{{ $p.ingress.host | quote }}]
      secretName: {{ $p.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ required "idp.ingress.host is required" $p.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
