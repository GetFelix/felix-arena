# Felix Arena on one machine, from the released images. Self-contained: it
# works from a clone or downloaded on its own. docs/self-hosting.md walks
# through it.
#
#   docker compose -f compose.yml up --detach
#
# Settings come from the environment or a .env file beside this one
# (deploy/.env.example lists them).
name: felix-arena

x-restart: &restart
  restart: unless-stopped

services:
  # The stand-in identity provider. It signs in anyone who picks a name, so
  # keep it on this machine (ARENA_BIND) unless you trust everyone who can
  # reach it.
  idp:
    <<: *restart
    image: ghcr.io/getfelix/felix-arena-idp:${ARENA_VERSION:-latest}
    environment:
      # The address browsers use; it is also the issuer Felix trusts.
      IDP_ISSUER: ${ARENA_IDP_URL:-http://127.0.0.1:9400}
      IDP_USERS: ${ARENA_PLAYERS:-ana,ben,dan,eve},${ARENA_WATCHERS:-cleo}
    ports:
      - "${ARENA_BIND:-127.0.0.1}:9400:9400"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9400/jwks.json"]
      interval: 5s
      timeout: 2s
      retries: 15

  # The control plane's metadata, so the arenas and who may play survive a
  # restart.
  postgres:
    <<: *restart
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: felix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-felix}
      POSTGRES_DB: felix
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felix -d felix"]
      interval: 5s
      timeout: 3s
      retries: 10

  controlplane:
    <<: *restart
    image: ghcr.io/getfelix/felix-controlplane:${FELIX_VERSION:-0.7.1}
    environment:
      FELIX_CONTROLPLANE_POSTGRES_URL: postgres://felix:${POSTGRES_PASSWORD:-felix}@postgres:5432/felix
      # The seed job creates the tenant through this. It is not published, so
      # only this stack can reach it.
      FELIX_BOOTSTRAP_ENABLED: "true"
      FELIX_BOOTSTRAP_BIND_ADDR: 0.0.0.0:9095
      FELIX_BOOTSTRAP_TOKEN: ${ARENA_BOOTSTRAP_TOKEN:-arena-bootstrap}
      # The IdP is plain HTTP on this stack's network.
      FELIX_CONTROLPLANE_OIDC_ALLOW_INSECURE_HTTP: "true"
      # The broker and the sim read their tokens once at startup, so these last
      # 30 days; the guide renews them with `docker compose run seed`.
      FELIX_EXCHANGE_TOKEN_TTL_SECONDS: "2592000"
      RUST_LOG: info
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    depends_on:
      idp:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Runs once per `up`: creates the arenas and who may play, and writes the
  # broker's and the sim's tokens to the state volume. Safe to run again.
  seed:
    image: ghcr.io/getfelix/felix-arena-seed:${ARENA_VERSION:-latest}
    environment:
      ARENA_FELIX_BOOTSTRAP_TOKEN: ${ARENA_BOOTSTRAP_TOKEN:-arena-bootstrap}
      ARENA_ARENAS: ${ARENA_ARENAS:-alpha bravo}
      ARENA_PLAYERS: ${ARENA_PLAYERS:-ana,ben,dan,eve}
      ARENA_WATCHERS: ${ARENA_WATCHERS:-cleo}
    volumes:
      - state:/state
    depends_on:
      controlplane:
        condition: service_healthy

  # Makes the broker's certificate once, so it is the same after a restart
  # and the gateway and the sim never hold a stale copy. It is self-signed and
  # not a CA: the clients trust this one certificate and nothing else.
  tls:
    image: docker.io/alpine/openssl:3.5.4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f /tls/tls.crt ] || openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 \
          -nodes -days 3650 -subj /CN=localhost -addext subjectAltName=DNS:localhost,DNS:broker \
          -addext basicConstraints=critical,CA:FALSE -addext extendedKeyUsage=serverAuth \
          -keyout /tls/tls.key -out /tls/tls.crt
        # The broker runs as uid 65532. The other containers on this private
        # volume can read the key too; it signs nothing outside the stack.
        chmod 644 /tls/tls.crt /tls/tls.key
    volumes:
      - tls:/tls

  broker:
    <<: *restart
    image: ghcr.io/getfelix/felix-broker:${FELIX_VERSION:-0.7.1}
    environment:
      FELIX_CONTROLPLANE_URL: http://controlplane:8443
      FELIX_NODE_TOKEN_FILE: /state/node.token
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix
      FELIX_TLS_CERT: /tls/tls.crt
      FELIX_TLS_KEY: /tls/tls.key
      # One listener, so the one published UDP port is the only one clients use.
      FELIX_QUIC_LISTENERS: "1"
      # Low-delay delivery batching, for the tick's trip to the browser.
      FELIX_EVENT_BATCH_MAX_EVENTS: "8"
      FELIX_EVENT_BATCH_MAX_DELAY_US: "100"
      FELIX_FANOUT_BATCH: "8"
      FELIX_SUB_FLUSH_MAX_DELAY_US: "0"
      # A slow spectator loses ticks instead of holding up everyone else.
      FELIX_SUB_QUEUE_POLICY: drop_new
      RUST_LOG: info
    volumes:
      - state:/state:ro
      - tls:/tls:ro
      - broker:/var/lib/felix
    depends_on:
      seed:
        condition: service_completed_successfully
      tls:
        condition: service_completed_successfully

  # felix-gateway with the arena's scope. It serves the web client on the
  # same port as the WebSocket the game plays through.
  gateway:
    <<: *restart
    image: ghcr.io/getfelix/felix-arena-gateway:${ARENA_VERSION:-latest}
    environment:
      GATEWAY_FELIX_BROKERS: broker:5000
      GATEWAY_FELIX_CA_FILE: /tls/tls.crt
      GATEWAY_FELIX_CONTROL_PLANE: http://controlplane:8443
      GATEWAY_TENANT: arena
      GATEWAY_OIDC_ISSUER: ${ARENA_IDP_URL:-http://127.0.0.1:9400}
      GATEWAY_OIDC_CLIENT_ID: felix-arena
      RUST_LOG: info
    ports:
      - "${ARENA_BIND:-127.0.0.1}:8787:8787"
    volumes:
      - tls:/tls:ro
    depends_on:
      broker:
        condition: service_started

  sim:
    <<: *restart
    image: ghcr.io/getfelix/felix-arena-sim:${ARENA_VERSION:-latest}
    environment:
      SIM_FELIX_BROKERS: broker:5000
      SIM_FELIX_CA_FILE: /tls/tls.crt
      SIM_FELIX_TOKEN_FILE: /state/sim.token
      SIM_TENANT: arena
      SIM_ARENAS: ${ARENA_ARENAS:-alpha bravo}
      SIM_WARMUP_SECONDS: ${SIM_WARMUP_SECONDS:-10}
      SIM_MATCH_SECONDS: ${SIM_MATCH_SECONDS:-300}
      SIM_RESULTS_SECONDS: ${SIM_RESULTS_SECONDS:-15}
      SIM_KILL_LIMIT: ${SIM_KILL_LIMIT:-25}
      SIM_RAIL_SECONDS: ${SIM_RAIL_SECONDS:-30}
      RUST_LOG: info
    volumes:
      - state:/state:ro
      - tls:/tls:ro
    depends_on:
      broker:
        condition: service_started

volumes:
  state:
  tls:
  broker:
  postgres:
