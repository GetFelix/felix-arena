<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Felix Arena · Lobby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--void);
        color: var(--ink);
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        pointer-events: none;
      }
      /* The live arena sits behind the lobby, dimmed toward the edges so the panels read first. */
      .shade {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 70% 60% at 50% 55%, var(--shade-mid), var(--shade-edge) 100%);
      }
      main {
        position: relative;
        max-width: 1240px;
        margin: 0 auto;
        padding: 36px 32px 48px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      header img {
        width: 46px;
        height: 52px;
        object-fit: contain;
        filter: drop-shadow(0 0 14px var(--accent-haze));
      }
      .brand b {
        display: block;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.16em;
      }
      .brand span {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .who {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        backdrop-filter: blur(10px);
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      .who b {
        color: var(--ink);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.on {
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }
      .intro {
        margin: 12vh 0 30px;
      }
      .intro h1 {
        margin: 0;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .intro p {
        margin: 10px 0 0;
        font-size: 16px;
        font-weight: 500;
        color: var(--muted);
      }
      .intro .count {
        font-weight: 700;
        color: var(--ink);
      }
      .arenas {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 20px;
      }
      .card {
        position: relative;
        display: grid;
        gap: 18px;
        padding: 22px 24px 22px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        backdrop-filter: blur(14px);
        overflow: hidden;
      }
      /* A thin team-coloured edge along the top: Coral's side to Violet's. */
      .card::before {
        content: '';
        position: absolute;
        inset: 0 0 auto;
        height: 2px;
        background: linear-gradient(90deg, var(--coral) 0 50%, var(--violet) 50% 100%);
        opacity: 0.75;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .name {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .pill {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--muted);
      }
      .pill.playing {
        color: var(--ink);
      }
      .pill.playing .dot {
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .board {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 16px 18px;
        border-radius: 12px;
        background: var(--well);
        border: 1px solid var(--line);
      }
      .team {
        display: grid;
        gap: 2px;
      }
      .team small {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }
      .team b {
        font-size: 38px;
        font-weight: 800;
        line-height: 1;
      }
      .team.violet {
        text-align: right;
      }
      .coral {
        color: var(--coral-text);
      }
      .violet {
        color: var(--violet-text);
      }
      .clock {
        display: grid;
        justify-items: center;
        gap: 4px;
        font-family: 'JetBrains Mono', monospace;
      }
      .clock b {
        font-size: 22px;
        font-weight: 600;
      }
      .clock span {
        font-size: 11px;
        color: var(--muted);
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 16px;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      .meta .n {
        color: var(--ink);
        font-family: 'JetBrains Mono', monospace;
      }
      .slots {
        display: flex;
        gap: 4px;
        margin-right: 2px;
      }
      .slots i {
        width: 7px;
        height: 14px;
        border-radius: 2px;
        background: var(--line);
      }
      .slots i.on {
        background: var(--ink);
      }
      .meta svg {
        width: 16px;
        height: 16px;
        margin-right: 4px;
        vertical-align: -3px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
      }
      .join {
        margin-left: auto;
        padding: 10px 22px;
        border-radius: 10px;
        border: 1px solid var(--accent);
        background: var(--accent-wash);
        color: var(--ink);
        font:
          700 13px/1 Inter,
          system-ui,
          sans-serif;
        letter-spacing: 0.1em;
        text-decoration: none;
        transition:
          background 0.15s,
          box-shadow 0.15s;
      }
      .join:hover,
      .join:focus-visible {
        background: var(--accent);
        box-shadow: 0 0 22px var(--accent-haze);
        outline: none;
      }
      .empty {
        grid-column: 1 / -1;
        padding: 40px;
        text-align: center;
        background: var(--panel);
        border: 1px dashed var(--line);
        border-radius: 16px;
        color: var(--muted);
        font-weight: 600;
      }
      footer {
        margin-top: auto;
        padding-top: 32px;
        font-size: 12px;
        color: var(--muted);
      }
      footer code {
        font-family: 'JetBrains Mono', monospace;
        color: var(--ink);
      }
      @media (max-width: 640px) {
        main {
          padding: 20px 16px 32px;
        }
        .intro h1 {
          font-size: 32px;
        }
        .arenas {
          grid-template-columns: 1fr;
        }
        .who span {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="shade"></div>
    <main>
      <header>
        <img id="mark" alt="" />
        <div class="brand"><b>FELIX ARENA</b><span>LOBBY</span></div>
        <div class="who"><i class="dot" id="link"></i><span>Signed in as</span><b id="user"></b></div>
      </header>
      <section class="intro">
        <h1>Live arenas</h1>
        <p><span class="count" id="count">Connecting</span> · Join a match in progress, as a player or to watch.</p>
      </section>
      <section class="arenas" id="arenas"></section>
      <footer>Every arena lists itself here while its simulation runs.</footer>
    </main>
    <script type="module" src="/src/lobby.ts"></script>
  </body>
</html>
