<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Felix Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--void);
        color: var(--ink);
        overflow: hidden;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .score {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .score .n {
        font-size: 20px;
        min-width: 24px;
        text-align: center;
      }
      .coral {
        color: var(--coral-text);
      }
      .violet {
        color: var(--violet-text);
      }
      .score .clock {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 13px;
        color: var(--muted);
      }
      .feed {
        position: absolute;
        top: 16px;
        right: 16px;
        display: grid;
        gap: 6px;
        justify-items: end;
      }
      .feed div {
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .feed div[data-kill] {
        pointer-events: auto;
        cursor: pointer;
        transition: border-color 150ms;
      }
      .feed div[data-kill]:hover {
        border-color: var(--muted);
      }
      .feed div[data-kill]::after {
        content: '';
        width: 0;
        height: 0;
        border-left: 6px solid var(--muted);
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        margin-left: 2px;
      }
      .feed .x {
        color: var(--muted);
        font-weight: 500;
      }
      .tag {
        position: absolute;
        left: 16px;
        bottom: 16px;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      .tag i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }
      .quality {
        margin-left: 12px;
        pointer-events: auto;
      }
      .quality select {
        margin-left: 6px;
        padding: 3px 6px;
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .bench {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        margin: 0;
        padding: 16px 20px;
        max-width: calc(100vw - 32px);
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        font:
          13px/1.5 'JetBrains Mono',
          ui-monospace,
          monospace;
        color: var(--ink);
        pointer-events: auto;
        user-select: text;
      }
      .phase {
        position: absolute;
        top: 66px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: var(--muted);
      }
      .banner {
        position: absolute;
        top: 24%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        text-shadow: 0 2px 18px var(--void);
      }
      .banner b {
        display: block;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .banner span {
        display: block;
        margin-top: 6px;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
      }
      .me {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 18px;
        align-items: center;
        padding: 10px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .meter {
        display: grid;
        gap: 5px;
      }
      .meter .bar {
        width: 180px;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
      }
      .meter .bar i {
        display: block;
        height: 100%;
        border-radius: 3px;
        background: var(--ink);
      }
      .meter.boost .bar {
        width: 90px;
      }
      .meter.boost .bar i {
        background: var(--accent);
      }
      .pips {
        display: flex;
        gap: 4px;
      }
      .pips i {
        width: 14px;
        height: 6px;
        border-radius: 2px;
        background: var(--line);
      }
      .pips i.on {
        background: var(--accent-glow);
        box-shadow: 0 0 8px var(--accent);
      }
      .board {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(640px, calc(100vw - 32px));
        padding: 26px 28px 22px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        backdrop-filter: blur(14px);
      }
      .board h2 {
        margin: 0;
        text-align: center;
        font-size: 34px;
        letter-spacing: 0.06em;
      }
      .board .final {
        margin: 6px 0 18px;
        text-align: center;
        font-size: 15px;
        font-weight: 700;
        color: var(--muted);
      }
      .board .final .n {
        font-size: 22px;
        margin: 0 8px;
      }
      .teams {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }
      .teams table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      .teams th {
        text-align: left;
        font-size: 11px;
        letter-spacing: 0.14em;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      .teams th:not(:first-child),
      .teams td:not(:first-child) {
        text-align: right;
        width: 34px;
        color: var(--muted);
      }
      .teams td {
        padding: 7px 0;
        font-weight: 600;
        border-bottom: 1px solid var(--line);
      }
      .teams tr.you td:first-child::after {
        content: ' · you';
        color: var(--muted);
        font-weight: 500;
      }
      .board .next {
        margin-top: 16px;
        text-align: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        color: var(--muted);
      }
      body.aiming canvas {
        cursor: none;
      }
      .reticle {
        position: absolute;
        top: -17px;
        left: -17px;
        width: 34px;
        height: 34px;
        color: var(--ink);
        filter: drop-shadow(0 0 1px var(--void)) drop-shadow(0 0 3px var(--void));
        will-change: transform;
      }
      .reticle svg {
        display: block;
        overflow: visible;
        stroke: currentColor;
        fill: none;
      }
      .reticle .ring {
        stroke-width: 1.5;
        opacity: 0.75;
      }
      .reticle .ticks {
        stroke-width: 1.75;
        stroke-linecap: round;
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 80ms ease-out;
      }
      .reticle.firing .ticks {
        transform: scale(0.78);
      }
      .reticle .dot {
        fill: currentColor;
        stroke: none;
      }
      .reticle.coral {
        color: var(--coral-text);
      }
      .reticle.violet {
        color: var(--violet-text);
      }
      .reticle.down {
        color: var(--muted);
        opacity: 0.6;
      }
      .replay {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 220ms ease-out;
      }
      .replay.on {
        opacity: 1;
      }
      .replay::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 55%, var(--void) 135%);
      }
      .replay .who {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding: 3px 8px 4px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 7px;
        will-change: transform;
      }
      .replay .who b {
        font-size: 14px;
        font-weight: 700;
      }
      .replay .who span {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: var(--muted);
      }
      .replay .bar {
        position: absolute;
        left: 0;
        right: 0;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        background: var(--void);
        transition: transform 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .replay .bar.top {
        top: 0;
        transform: translateY(-100%);
      }
      .replay .bar.bottom {
        bottom: 0;
        transform: translateY(100%);
      }
      .replay.on .bar {
        transform: none;
      }
      .replay .tag-replay {
        position: absolute;
        left: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.24em;
      }
      .replay .tag-replay i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ink);
        animation: replay-dot 1.2s ease-in-out infinite;
      }
      @keyframes replay-dot {
        50% {
          opacity: 0.25;
        }
      }
      .replay .speed {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        letter-spacing: 0;
        color: var(--muted);
      }
      .replay .title {
        display: flex;
        gap: 10px;
        align-items: baseline;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .replay .title .x {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }
      .replay .timeline {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--line);
      }
      .replay .timeline i {
        position: absolute;
        inset: 0;
        background: var(--ink);
        opacity: 0.55;
        transform-origin: left;
      }
      .replay .timeline b {
        position: absolute;
        top: -3px;
        width: 2px;
        height: 8px;
        margin-left: -1px;
        background: var(--ink);
      }
      .replay .views {
        display: flex;
        gap: 18px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      .replay .views span {
        display: flex;
        gap: 7px;
        align-items: center;
        transition: color 160ms;
      }
      .replay .views span.on {
        color: var(--ink);
      }
      .replay kbd {
        min-width: 20px;
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        font:
          500 11px 'JetBrains Mono',
          monospace;
        text-align: center;
        color: var(--muted);
      }
      .replay .views span.on kbd {
        color: var(--void);
        background: var(--ink);
        border-color: var(--ink);
      }
      .replay .views .skip {
        margin-left: 14px;
        padding-left: 18px;
        border-left: 1px solid var(--line);
      }
      body.replaying .score,
      body.replaying .phase,
      body.replaying .me,
      body.replaying .banner,
      body.replaying .feed,
      body.replaying .tag {
        opacity: 0;
      }
      .score,
      .phase,
      .me,
      .banner,
      .feed,
      .tag {
        transition: opacity 200ms;
      }
      .replays {
        position: absolute;
        top: 50%;
        right: 16px;
        transform: translateY(-50%);
        width: min(360px, calc(100vw - 32px));
        max-height: min(560px, calc(100vh - 140px));
        overflow: auto;
        padding: 18px 18px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        backdrop-filter: blur(14px);
        pointer-events: auto;
      }
      .replays h3 {
        margin: 0 0 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        letter-spacing: 0.2em;
      }
      .replays kbd {
        padding: 2px 6px;
        border: 1px solid var(--line);
        border-radius: 5px;
        font: 500 11px 'JetBrains Mono', monospace;
        letter-spacing: 0;
        color: var(--muted);
      }
      .replays h4 {
        margin: 14px 0 6px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .replays p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      .replays .kill {
        width: 100%;
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 7px 8px;
        border: 0;
        border-radius: 7px;
        background: none;
        color: var(--ink);
        font:
          600 13px Inter,
          system-ui,
          sans-serif;
        text-align: left;
        cursor: pointer;
      }
      .replays .kill:hover {
        background: var(--line);
      }
      .replays .kill:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .replays .kill .t {
        width: 36px;
        font:
          500 11px 'JetBrains Mono',
          monospace;
        color: var(--muted);
      }
      .replays .kill .x {
        font-weight: 500;
        color: var(--muted);
      }
      .replays .earlier {
        margin-top: 12px;
        width: 100%;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: none;
        color: var(--muted);
        font:
          600 12px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
      }
      .replays .earlier:hover {
        color: var(--ink);
      }
      .replays .note {
        margin-top: 8px;
        min-height: 1em;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      .open-replays {
        margin-left: 12px;
        padding: 3px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        pointer-events: auto;
        cursor: pointer;
      }
      body.replaying .replays {
        opacity: 0;
        pointer-events: none;
      }
      .gone {
        position: absolute;
        top: 24%;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 600px) {
        .feed {
          display: none;
        }
        .score {
          top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="loading" id="loading">Loading arena</div>
    <div class="hud">
      <div class="score">
        <span class="coral">CORAL</span><span class="n coral" id="coral">0</span
        ><span class="clock" id="clock">0:00</span><span class="n violet" id="violet">0</span
        ><span class="violet">VIOLET</span>
      </div>
      <div class="phase" id="phase"></div>
      <div class="feed" id="feed"></div>
      <div class="banner" id="banner" hidden><b id="banner-title"></b><span id="banner-sub"></span></div>
      <div class="me" id="me" hidden>
        <div class="meter">
          <span>Hull</span>
          <div class="bar"><i id="health"></i></div>
        </div>
        <div class="meter boost">
          <span>Boost</span>
          <div class="bar"><i id="boost"></i></div>
        </div>
        <div class="meter">
          <span>Rail</span>
          <div class="pips" id="rail"><i></i><i></i><i></i></div>
        </div>
      </div>
      <div class="reticle" id="reticle" hidden>
        <svg viewBox="-17 -17 34 34" width="34" height="34">
          <circle class="ring" r="7" />
          <path class="ticks" d="M0 -15.5V-10.5M0 10.5V15.5M-15.5 0H-10.5M10.5 0H15.5" />
          <circle class="dot" r="1.3" />
        </svg>
      </div>
      <div class="board" id="board" hidden>
        <h2 id="board-title"></h2>
        <div class="final">
          <span class="coral">CORAL</span><span class="n coral" id="board-coral"></span>–<span
            class="n violet"
            id="board-violet"
          ></span
          ><span class="violet">VIOLET</span>
        </div>
        <div class="teams">
          <table>
            <thead>
              <tr>
                <th class="coral">CORAL</th>
                <th>K</th>
                <th>D</th>
              </tr>
            </thead>
            <tbody id="board-coral-players"></tbody>
          </table>
          <table>
            <thead>
              <tr>
                <th class="violet">VIOLET</th>
                <th>K</th>
                <th>D</th>
              </tr>
            </thead>
            <tbody id="board-violet-players"></tbody>
          </table>
        </div>
        <div class="next" id="board-next"></div>
      </div>
      <div class="replay" id="replay">
        <div class="who" id="replay-who-killer"><b></b><span>KILLER</span></div>
        <div class="who" id="replay-who-victim"><b></b><span></span></div>
        <div class="bar top">
          <div class="tag-replay"><i></i>REPLAY<span class="speed" id="replay-speed"></span></div>
          <div class="title" id="replay-title"></div>
        </div>
        <div class="bar bottom">
          <div class="timeline"><i id="replay-progress"></i><b id="replay-mark"></b></div>
          <div class="views">
            <span id="replay-victim"><kbd>1</kbd>Victim</span>
            <span id="replay-killer"><kbd>2</kbd>Killer</span>
            <span id="replay-orbit"><kbd>3</kbd>Orbit</span>
            <span class="skip"><kbd>Space</kbd>Skip</span>
          </div>
        </div>
      </div>
      <div class="gone" id="replay-gone" hidden>Replay no longer available</div>
      <div class="replays" id="replays" hidden>
        <h3>REPLAYS <kbd>R</kbd></h3>
        <div id="replays-list"></div>
        <button class="earlier" id="replays-earlier">Earlier match</button>
        <div class="note" id="replays-note"></div>
      </div>
      <div class="tag">
        <i></i><span id="where">felix-arena</span>
        <button class="open-replays" id="open-replays">Replays</button>
        <label class="quality"
          >Quality
          <select id="quality">
            <option value="auto">Auto</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select></label
        >
      </div>
      <pre class="bench" id="bench" hidden></pre>
    </div>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
