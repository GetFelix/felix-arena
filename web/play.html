<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Felix Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--void);
        color: var(--ink);
        overflow: hidden;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        display: block;
      }
      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .score {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .score .n {
        font-size: 20px;
        min-width: 24px;
        text-align: center;
      }
      .coral {
        color: var(--coral-text);
      }
      .violet {
        color: var(--violet-text);
      }
      .score .clock {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 13px;
        color: var(--muted);
      }
      .feed {
        position: absolute;
        top: 16px;
        right: 16px;
        display: grid;
        gap: 6px;
        justify-items: end;
      }
      .feed div {
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .feed .x {
        color: var(--muted);
        font-weight: 500;
      }
      .tag {
        position: absolute;
        left: 16px;
        bottom: 16px;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      .tag i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }
      .loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 600px) {
        .feed {
          display: none;
        }
        .score {
          top: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="loading" id="loading">Loading arena</div>
    <div class="hud">
      <div class="tag"><i></i><span id="where">felix-arena</span></div>
    </div>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
