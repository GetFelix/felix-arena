# Broker-wide retention short enough to watch it trim a tick log: 64 KB
# segments and about 1.5 MB kept per log, a little over two minutes of ticks at
# 30 Hz. CI's `kill feed` job uses it to see a replay refused as trimmed; the
# window is long enough for a slow runner to load a page and replay a kill
# before retention takes it.
# Use: ARENA_COMPOSE_EXTRA=retention.yml dev/up.sh
services:
  broker:
    environment:
      FELIX_DURABLE_SEGMENT_BYTES: "65536"
      FELIX_DURABLE_RETENTION_BYTES: "1572864"
      FELIX_DURABLE_RETENTION_INTERVAL_SECONDS: "1"
