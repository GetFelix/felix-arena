# The development stack: a control plane, one broker, a stand-in IdP, a
# one-shot seed that creates the arenas, the gateway and the sim.
# `dev/up.sh` starts it and waits until the broker is ready.
name: felix-arena

services:
  idp:
    image: docker.io/library/node:24-alpine
    command: ["node", "/app/idp.mjs"]
    environment:
      # Browsers sign in on the host, so the issuer is the host's address.
      IDP_ISSUER: http://127.0.0.1:9400
    ports:
      - "127.0.0.1:9400:9400"
    volumes:
      - ./idp.mjs:/app/idp.mjs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9400/jwks.json"]
      interval: 2s
      timeout: 2s
      retries: 15

  controlplane:
    image: ghcr.io/getfelix/felix-controlplane:0.6.0-preview.7
    environment:
      # In-memory store: a restart of the stack starts from nothing.
      FELIX_BOOTSTRAP_ENABLED: "true"
      FELIX_BOOTSTRAP_BIND_ADDR: 0.0.0.0:9095
      FELIX_BOOTSTRAP_TOKEN: dev-bootstrap
      # The dev IdP is plain HTTP on the compose network.
      FELIX_CONTROLPLANE_OIDC_ALLOW_INSECURE_HTTP: "true"
      # The broker and the sim read their tokens once at startup, so the
      # default 15 minutes would end a dev session early.
      FELIX_EXCHANGE_TOKEN_TTL_SECONDS: "86400"
      RUST_LOG: info
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      idp:
        condition: service_healthy

  seed:
    image: docker.io/library/node:24-alpine
    command: ["node", "/app/seed.mjs"]
    environment:
      # dan and eve make two a side, with ana and ben.
      ARENA_PLAYERS: ana,ben,dan,eve
    volumes:
      - ./seed.mjs:/app/seed.mjs:ro
      - ./state:/state
    depends_on:
      controlplane:
        condition: service_healthy

  broker:
    image: ghcr.io/getfelix/felix-broker:0.6.0-preview.7
    environment:
      FELIX_CONTROLPLANE_URL: http://controlplane:8443
      FELIX_NODE_TOKEN_FILE: /state/node.token
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix
      FELIX_TLS_CERT_EXPORT: /state/broker-cert.pem
      # One listener, so the one published UDP port is the only one clients use.
      FELIX_QUIC_LISTENERS: "1"
      # Low-delay delivery batching, for the tick's trip to the browser.
      FELIX_EVENT_BATCH_MAX_EVENTS: "8"
      FELIX_EVENT_BATCH_MAX_DELAY_US: "100"
      FELIX_FANOUT_BATCH: "8"
      FELIX_SUB_FLUSH_MAX_DELAY_US: "0"
      # Not the latency profile's `block`: that would let one slow spectator
      # hold up fanout to everyone.
      FELIX_SUB_QUEUE_POLICY: drop_new
      RUST_LOG: info
    ports:
      - "127.0.0.1:5000:5000/udp"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./state:/state
      - felix-data:/var/lib/felix
    depends_on:
      seed:
        condition: service_completed_successfully

  gateway:
    image: ghcr.io/getfelix/felix-gateway:0.4.0
    environment:
      GATEWAY_FELIX_BROKERS: broker:5000
      GATEWAY_FELIX_CA_FILE: /state/broker-cert.pem
      GATEWAY_FELIX_CONTROL_PLANE: http://controlplane:8443
      GATEWAY_TENANT: arena
      GATEWAY_OIDC_ISSUER: http://127.0.0.1:9400
      GATEWAY_OIDC_CLIENT_ID: felix-arena
      RUST_LOG: info
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./scope.toml:/etc/felix-gateway/scope.toml:ro
      - ./state:/state:ro
    depends_on:
      broker:
        condition: service_started

  sim:
    build:
      context: ..
      dockerfile: docker/sim.Dockerfile
    environment:
      SIM_FELIX_BROKERS: broker:5000
      SIM_FELIX_CA_FILE: /state/broker-cert.pem
      SIM_FELIX_TOKEN_FILE: /state/sim.token
      SIM_TENANT: arena
      SIM_ARENAS: alpha bravo
      # The match's lengths; CI's match job shortens them.
      SIM_WARMUP_SECONDS: ${SIM_WARMUP_SECONDS:-10}
      SIM_MATCH_SECONDS: ${SIM_MATCH_SECONDS:-300}
      SIM_RESULTS_SECONDS: ${SIM_RESULTS_SECONDS:-15}
      SIM_KILL_LIMIT: ${SIM_KILL_LIMIT:-25}
      SIM_RAIL_SECONDS: ${SIM_RAIL_SECONDS:-30}
      RUST_LOG: info
    volumes:
      - ./state:/state:ro
    depends_on:
      broker:
        condition: service_started

volumes:
  felix-data:
