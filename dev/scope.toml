# What the gateway lets a browser session reach. A session joins one arena,
# or `lobby` for the lobby page, which reaches only the lobby cache: every
# per-arena resource is optional, so `hello` lists what a sign-in lacks.
# dev/seed.mjs creates these for arenas `alpha` and `bravo`.

# Lets a page slow its own connection, for the slow-link switch on the play page
# and CI's throttle lane. Leave it off on a public gateway.
allow_throttle = true

[scope]
field = "arena"

[[scope.streams]]
alias = "ticks"
name = "arena.ticks.{scope}"
actions = ["subscribe"]
optional = true

[[scope.streams]]
alias = "input"
name = "arena.input.{scope}"
actions = ["publish"]
# The sim learns who sent each input from the gateway's stamp.
stamp_sender = true
# A spectator has no publish right here and still joins.
optional = true

# One key per open session, `play:<name>` or `watch:<name>`, written every
# 10 s; a closed tab's key lapses within 30 s.
[[scope.caches]]
alias = "members"
name = "arena.members.{scope}"
actions = ["read", "write", "watch"]
ttl_s = 30
optional = true

# Each arena's status, written by its sim with a 10 s TTL.
[[scope.caches]]
alias = "lobby"
name = "arena.lobby"
actions = ["read", "watch"]
shared = true
